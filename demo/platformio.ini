; VectiSuite demo — exercises VectiOTA + VectiSerial + VectiNet + VectiDash
; Target: ESP32-S3 N8R2 (8MB flash, 2MB PSRAM, USB-Serial/JTAG)
;
; Build:   cd demo && pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; The four libraries live under ../libraries/Vecti*/src and are pulled in
; via lib_extra_dirs so we stay close to a "drop-into-libraries" install
; flow without polluting the global Arduino library path.

[platformio]
default_envs = esp32s3-n8r2

[env:esp32s3-n8r2]
platform = espressif32 @ ^6.7.0
board    = esp32-s3-devkitc-1
framework = arduino

; N8R2 = 8MB flash, 2MB PSRAM. The stock arduino-esp32 board file targets
; N16R8; override the partition table + flash size so the OTA partitions
; line up with what we actually have.
board_upload.flash_size = 8MB
board_build.flash_size  = 8MB
board_build.partitions  = default_8MB.csv
board_build.f_flash     = 80000000L
board_build.flash_mode  = qio
; N8R2 = 2MB PSRAM on QSPI lines (not OPI like N16R8). Using qio_opi would
; print "PSRAM ID read error" on boot and disable PSRAM entirely.
board_build.arduino.memory_type = qio_qspi

; USB-Serial/JTAG console (the chip exposes /dev/cu.usbmodemXXXX directly,
; no CP210x bridge involved). CDC-on-boot lets Serial.print show up over
; the same USB cable used for flashing.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
build_unflags = -std=gnu++11

; The custom libraries sit one level up. lib_extra_dirs gives PlatformIO
; another search root in addition to ./lib so the VectiSuite tree is
; usable as-is without symlinking into the project's own lib/.
lib_extra_dirs =
    ../libraries

; Third-party dependencies — locked to versions that are known to work
; together on arduino-esp32 3.x. ESPAsyncWebServer + AsyncTCP are the
; de-facto async HTTP stack the libraries are written against.
lib_deps =
    ; ^3.11.0, not ^3.7.0: all four libraries call AsyncURIMatcher::exact(),
    ; which does not exist below 3.11.0. The old floor let the resolver pick a
    ; version the sources cannot compile against.
    ESP32Async/ESPAsyncWebServer @ ^3.11.0
    ESP32Async/AsyncTCP          @ ^3.4.0
    bblanchon/ArduinoJson        @ ^7.4.0

; The global library store (~/.platformio/lib) holds RP2040/ESP8266 async TCP
; ports from unrelated work. The dependency finder will happily pull one in and
; fail the build on an #error meant for a different board, so name the ones this
; ESP32 target must never see.
lib_ignore =
    AsyncTCP_RP2040W
    ESPAsyncTCP

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed    = 921600

; ---------------------------------------------------------------------------
; Build matrix. These exist so "supports the whole ESP family" is a tested
; claim rather than an assertion. `pio run` builds every one.
; ---------------------------------------------------------------------------
[matrix]
framework = arduino
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_extra_dirs = ../libraries
lib_ignore = AsyncTCP_RP2040W, ESPAsyncTCP
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.11.0
    ESP32Async/AsyncTCP          @ ^3.4.0
    bblanchon/ArduinoJson        @ ^7.4.0

[env:esp32]
extends = matrix
platform = espressif32 @ ^6.7.0
board = esp32dev

[env:esp32s2]
extends = matrix
platform = espressif32 @ ^6.7.0
board = esp32-s2-saola-1

[env:esp32c3]
extends = matrix
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1

; C6 and H2 need arduino-esp32 3.x, which the official espressif32 6.x platform
; does not ship (it tops out at core 2.0.17). The pioarduino fork carries 3.x.
[env:esp32c6]
extends = matrix
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1

[env:esp32h2]
extends = matrix
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-h2-devkitm-1

[env:esp32s3-matrix]
extends = matrix
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1

; ESP8266 smoke build. The full four-library demo does not fit or apply here
; (VectiNet is ESP32-only), so this env builds the OTA library alone against a
; minimal sketch — see demo/esp8266/.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ../libraries
lib_ignore = AsyncTCP, AsyncTCP_RP2040W, VectiNet, VectiDash, VectiSerial
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.11.0
    esphome/ESPAsyncTCP-esphome  @ ^2.0.0
    bblanchon/ArduinoJson        @ ^7.4.0
build_src_filter = -<*> +<../esp8266/>
