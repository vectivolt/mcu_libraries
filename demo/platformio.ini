; JouleSuite demo — exercises JouleOTA + JouleSerial + JouleNet + JouleDash
; Target: ESP32-S3 N8R2 (8MB flash, 2MB PSRAM, USB-Serial/JTAG)
;
; Build:   cd demo && pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; The four libraries live under ../libraries/Joule*/src and are pulled in
; via lib_extra_dirs so we stay close to a "drop-into-libraries" install
; flow without polluting the global Arduino library path.

[platformio]
default_envs = esp32s3-n8r2

[env:esp32s3-n8r2]
platform = espressif32 @ ^6.7.0
board    = esp32-s3-devkitc-1
framework = arduino

; N8R2 = 8MB flash, 2MB PSRAM. The stock arduino-esp32 board file targets
; N16R8; override the partition table + flash size so the OTA partitions
; line up with what we actually have.
board_upload.flash_size = 8MB
board_build.flash_size  = 8MB
board_build.partitions  = default_8MB.csv
board_build.f_flash     = 80000000L
board_build.flash_mode  = qio
; N8R2 = 2MB PSRAM on QSPI lines (not OPI like N16R8). Using qio_opi would
; print "PSRAM ID read error" on boot and disable PSRAM entirely.
board_build.arduino.memory_type = qio_qspi

; USB-Serial/JTAG console (the chip exposes /dev/cu.usbmodemXXXX directly,
; no CP210x bridge involved). CDC-on-boot lets Serial.print show up over
; the same USB cable used for flashing.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
build_unflags = -std=gnu++11

; The custom libraries sit one level up. lib_extra_dirs gives PlatformIO
; another search root in addition to ./lib so the JouleSuite tree is
; usable as-is without symlinking into the project's own lib/.
lib_extra_dirs =
    ../libraries

; Third-party dependencies — locked to versions that are known to work
; together on arduino-esp32 3.x. ESPAsyncWebServer + AsyncTCP are the
; de-facto async HTTP stack the libraries are written against.
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP          @ ^3.4.0
    bblanchon/ArduinoJson        @ ^7.4.0

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed    = 921600
