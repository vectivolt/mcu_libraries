<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "err": "#ef4444",
                    "error-container": "#93000a",
                    "on-primary-container": "#0d0096",

<style>
        body {
            background-color: #08090f;
            color: #e4e1ed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Blur Blobs */
        .blur-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(99, 102, 241, 0.15); }
        .blob-2 { bottom: 20%; right: -20%; width: 60vw; height: 60vw; background: rgba(139, 92, 246, 0.12); }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: rgba(99, 102, 241, 0.08); }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .lucide {
            stroke-width: 2.2px;
        }

        /* Card Sheen */
        .card-sheen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent);
            border-radius: inherit;
            pointer-events: none;
        }

        /* Drop Zone Animation */
        @keyframes pulse-border {
            0% { border-color: rgba(99, 102, 241, 0.3); }
            50% { border-color: rgba(99, 102, 241, 0.7); }
            100% { border-color: rgba(99, 102, 241, 0.3); }
        }
        .drop-zone:hover {
            animation: pulse-border 2s infinite;
            background: rgba(99, 102, 241, 0.05);
        }
        
        .logo-gradient {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen relative overflow-x-hidden flex flex-col font-body">
<!-- Atmospheric Blobs -->
<div class="blur-blob blob-1"></div>
<div class="blur-blob blob-2"></div>
<div class="blur-blob blob-3"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-[20px] saturate-[160%] shadow-sm flex items-center justify-between px-md w-full h-16">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined text-[20px]" data-icon="bolt">bolt</span>
</button>
<div class="flex items-center gap-2">
<div class="w-[22px] h-[22px] rounded-[6px] logo-gradient flex items-center justify-center shadow-[0_2px_8px_rgba(99,102,241,0.4)]">
<span class="material-symbols-outlined text-[14px] text-white" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<h1 class="font-title-header text-title-header font-bold text-primary dark:text-primary tracking-tight">JouleOTA</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined text-[20px]" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-24 pb-28 px-4 flex flex-col gap-4 max-w-[390px] mx-auto w-full relative z-10">
<!-- Device Status Card -->
<div class="bg-panel-dark rounded-2xl border border-white/5 shadow-card relative card-sheen p-5 flex flex-col gap-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-[6px] h-[6px] rounded-full bg-ok shadow-[0_0_0_4px_rgba(16,185,129,0.18)] animate-pulse" style="animation-duration: 2.4s;"></div>
<span class="font-subtitle-header text-subtitle-header text-on-surface-variant">Device Online</span>
</div>
<span class="px-2 py-0.5 rounded-full border border-white/10 bg-panel-2-dark font-mono-code text-mono-code text-primary">IDLE</span>
</div>
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center border-b border-white/5 pb-2">
<span class="font-body text-body text-muted-dark">Hardware ID</span>
<span class="font-mono-code text-mono-code text-on-surface">D0:CF:13:73:0A:B8</span>
</div>
<div class="flex justify-between items-center border-b border-white/5 pb-2">
<span class="font-body text-body text-muted-dark">Firmware</span>
<span class="font-mono-code text-mono-code text-on-surface">v1.2.4-stable</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body text-body text-muted-dark">Free Heap</span>
<span class="font-mono-code text-mono-code text-on-surface">248 KB</span>
</div>
</div>
</div>
<!-- Update Mode Tabs -->
<div class="flex gap-2 p-1 bg-surface-container-low rounded-xl border border-white/5">
<button class="flex-1 py-2 rounded-lg bg-primary-container text-on-primary-container font-button text-button shadow-sm transition-all text-center">
                Firmware
            </button>
<button class="flex-1 py-2 rounded-lg text-on-surface-variant font-button text-button hover:bg-surface-variant/30 transition-all text-center">
                Filesystem
            </button>
</div>
<!-- Drop Zone -->
<div class="drop-zone border-2 border-dashed border-outline-variant/50 rounded-2xl min-h-[260px] flex flex-col items-center justify-center gap-4 bg-surface-container-lowest/50 transition-all cursor-pointer group">
<div class="w-16 h-16 rounded-full bg-panel-2-dark flex items-center justify-center border border-white/5 group-hover:scale-105 group-hover:bg-primary/10 group-hover:border-primary/30 transition-all duration-300">
<span class="material-symbols-outlined text-[32px] text-muted-dark group-hover:text-primary transition-colors" data-icon="cloud_upload">cloud_upload</span>
</div>
<div class="flex flex-col items-center gap-1 text-center px-6">
<span class="font-subtitle-header text-subtitle-header text-on-surface">Drop a .bin here or click to browse</span>
<span class="font-section-label text-section-label text-muted-dark">Max size: 1.5MB</span>
</div>
</div>
<!-- Maintenance Card -->
<div class="bg-panel-dark rounded-2xl border border-white/5 shadow-card relative card-sheen p-5 flex flex-col gap-3 mt-2">
<span class="font-subtitle-header text-subtitle-header text-muted-dark mb-1">Maintenance Actions</span>
<button class="w-full py-3 rounded-lg bg-panel-2-dark border border-white/10 font-button text-button text-on-surface flex items-center justify-center gap-2 hover:border-primary/50 hover:text-primary transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
                Commit current
            </button>
<button class="w-full py-3 rounded-lg bg-gradient-to-r from-err to-[#f87171] shadow-danger font-button text-button text-white flex items-center justify-center gap-2 hover:-translate-y-[1px] hover:shadow-[0_6px_20px_rgba(239,68,68,0.4)] transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[16px]" data-icon="history">history</span>
                Rollback
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-4 z-50 bg-surface/80 dark:bg-surface/80 pb-safe backdrop-blur-[20px] saturate-[160%] shadow-[0_-4px_12px_rgba(0,0,0,0.1)] md:hidden">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-transform cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="update" style="font-variation-settings: 'FILL' 1;">update</span>
<span class="font-section-label text-section-label">Firmware</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-xl px-4 py-1 active:scale-90 transition-transform cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="folder_open">folder_open</span>
<span class="font-section-label text-section-label">Filesystem</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-xl px-4 py-1 active:scale-90 transition-transform cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="cloud_download">cloud_download</span>
<span class="font-section-label text-section-label">Pull URL</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the drop zone
        document.querySelector('.drop-zone').addEventListener('click', function() {
            this.style.transform = 'scale(0.98)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
</body></html>
