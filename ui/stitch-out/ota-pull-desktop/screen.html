<style>
        .pulse-ok {
            animation: pulse-ok 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ok {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }

        }

            stroke-width: 2.2px;
            width: 16px;
            height: 16px;

<body class="bg-bg-dark text-on-background min-h-screen relative overflow-x-hidden font-body text-body">
<!-- Ambient Blurs -->
<div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/10 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-[#8b5cf6]/10 blur-[150px] pointer-events-none"></div>

<nav class="sticky top-0 w-full bg-background/80 backdrop-blur-xl border-b border-outline-variant/20 shadow-sm z-50">
<div class="flex justify-between items-center h-16 px-xl max-w-7xl mx-auto w-full">
<div class="flex items-center gap-md">
<div class="w-[32px] h-[32px] rounded-[11px] bg-brand-gradient flex items-center justify-center shadow-btn">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-title-header text-title-header text-ink-dark">JouleSuite OTA</span>
</div>
<div class="flex items-center gap-lg">
<div class="flex items-center gap-sm px-md py-xs rounded-full bg-surface-container border border-outline-variant/30">
<div class="w-1.5 h-1.5 rounded-full bg-ok pulse-ok relative">
<div class="absolute -inset-1 rounded-full border border-ok/20"></div>
</div>
<span class="font-mono-code text-mono-code text-muted-dark">Live</span>
</div>
<button class="p-2 rounded-lg text-muted-dark hover:text-primary transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</div>
</div>
</nav>
<main class="max-w-4xl mx-auto px-lg py-xl md:py-3xl flex flex-col gap-xl">
<!-- DEVICE CARD -->
<section class="bg-panel-dark rounded-[20px] border border-white/[0.06] shadow-card bg-card-sheen p-card-padding relative overflow-hidden">
<h2 class="font-section-label text-section-label text-muted-dark uppercase tracking-wider mb-lg">Device Status</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-lg">
<div class="flex flex-col gap-xs">
<span class="font-subtitle-header text-subtitle-header text-muted-dark">Hardware ID</span>
<span class="font-mono-code text-mono-code text-ink-dark">ESP32-S3-WROOM</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-subtitle-header text-subtitle-header text-muted-dark">Firmware</span>
<span class="font-mono-code text-mono-code text-primary">v1.2.2-stable</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-subtitle-header text-subtitle-header text-muted-dark">Slots</span>
<span class="font-mono-code text-mono-code text-ink-dark">APP0 / APP1</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-subtitle-header text-subtitle-header text-muted-dark">Free Heap</span>
<span class="font-mono-code text-mono-code text-ink-dark px-sm py-xs bg-panel-2-dark rounded-md border border-white/[0.04] w-fit">248 KB</span>
</div>
</div>
</section>
<!-- UPLOAD CARD -->
<section class="bg-panel-dark rounded-[20px] border border-white/[0.06] shadow-card bg-card-sheen flex flex-col relative overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-white/[0.06] px-card-padding pt-md overflow-x-auto no-scrollbar">
<button class="px-md py-sm font-button text-button text-muted-dark hover:text-ink-dark transition-colors border-b-2 border-transparent">
                    Firmware
                </button>
<button class="px-md py-sm font-button text-button text-muted-dark hover:text-ink-dark transition-colors border-b-2 border-transparent">
                    Filesystem
                </button>
<button class="px-md py-sm font-button text-button text-primary border-b-2 border-primary bg-white/[0.02] rounded-t-lg">
                    Pull URL
                </button>
</div>
<!-- Content -->
<div class="p-card-padding flex flex-col gap-xl">
<div class="flex flex-col gap-sm">
<label class="font-subtitle-header text-subtitle-header text-muted-dark" for="url-input">Source URL</label>
<div class="relative">
<input class="w-full bg-panel-2-dark border border-white/[0.08] rounded-lg px-md py-md font-mono-code text-mono-code text-ink-dark focus:ring-1 focus:ring-primary focus:border-primary focus:outline-none transition-shadow shadow-inner" id="url-input" type="text" value="https://builds.example.com/v1.2.3/firmware.bin"/>
</div>
<p class="font-body text-[13px] text-muted-dark mt-xs">Device will download and flash directly from this URL.</p>
</div>
<div class="flex items-center gap-md pt-sm">
<button class="bg-brand-gradient shadow-btn hover:shadow-btn-hover hover:-translate-y-[2px] transition-all duration-200 rounded-full px-xl py-sm flex items-center gap-sm">
<svg class="lucide text-white w-[16px] h-[16px]" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><path d="M12 12v7"></path><path d="m9 15 3 3 3-3"></path></svg>
<span class="font-button text-button text-white">Pull &amp; flash</span>
</button>
<button class="bg-panel-2-dark border border-white/[0.08] hover:border-primary/50 hover:text-primary transition-colors duration-200 rounded-full px-xl py-sm">
<span class="font-button text-button text-ink-dark">Cancel</span>
</button>
</div>
</div>
</section>
<!-- MAINTENANCE CARD -->
<section class="bg-panel-dark rounded-[20px] border border-white/[0.06] shadow-card bg-card-sheen p-card-padding relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-warn/40"></div>
<div class="pl-sm">
<h2 class="font-section-label text-section-label text-muted-dark uppercase tracking-wider mb-lg">Maintenance</h2>
<div class="flex flex-col sm:flex-row gap-md">
<button class="bg-panel-2-dark border border-white/[0.08] hover:border-primary/50 hover:text-primary transition-colors duration-200 rounded-full px-xl py-sm flex items-center justify-center gap-sm flex-1">
<span class="material-symbols-outlined text-[16px]" data-icon="task_alt">task_alt</span>
<span class="font-button text-button text-ink-dark">Commit current</span>
</button>
<button class="bg-danger-gradient shadow-[0_4px_14px_-2px_rgba(239,68,68,0.4)] hover:shadow-[0_6px_20px_-2px_rgba(239,68,68,0.6)] hover:-translate-y-[2px] transition-all duration-200 rounded-full px-xl py-sm flex items-center justify-center gap-sm flex-1">
<span class="material-symbols-outlined text-[16px] text-white" data-icon="history">history</span>
<span class="font-button text-button text-white">Rollback</span>
</button>
</div>
</div>
</section>
