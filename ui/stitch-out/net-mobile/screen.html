<!DOCTYPE html>

                        "ink-dark": "#f1f3fa",
                        "surface-dim": "#13131b",
                        "panel-light": "#ffffff",
                        "on-surface-variant": "#c7c4d7",
                        "on-surface": "#e4e1ed",
                        "ink-2-light": "#42485c",
                        "info": "#06b6d4",
                        "muted-dark": "#7a809a",
                        "background": "#13131b",
                        "tertiary-fixed": "#ffdcc5",
                        "on-background": "#e4e1ed",

<style>
        body {
            background-color: #08090f;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Blur Blobs */
        .blur-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }
        .blob-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: rgba(99, 102, 241, 0.15); }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: rgba(139, 92, 246, 0.12); }
        
        /* Custom Scrollbar for list */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Animation */
        @keyframes pulse-ok {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.18); }
            70% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-ok {
            animation: pulse-ok 2.4s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface flex flex-col h-screen max-w-[390px] mx-auto relative border-x border-outline-variant/10 shadow-2xl bg-bg-dark">
<!-- Ambient Background -->
<div class="blur-blob blob-1"></div>
<div class="blur-blob blob-2"></div>
<!-- Header -->
<header class="sticky top-0 z-50 bg-background/80 backdrop-blur-[20px] saturate-160 px-xl py-lg border-b border-outline-variant/10 flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-[22px] h-[22px] rounded-[6px] bg-brand-gradient flex items-center justify-center shadow-btn">
<span class="material-symbols-outlined text-[14px] text-panel-light" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<h1 class="font-title-header text-title-header tracking-tight">JouleNet</h1>
</div>
<div class="flex items-center gap-xs">
<div class="w-1.5 h-1.5 rounded-full bg-ok status-ok ring-4 ring-ok/20"></div>
<span class="font-mono-code text-[10px] text-muted-dark">ONLINE</span>
</div>
</header>
<!-- Segmented Tabs -->
<div class="px-xl pt-lg pb-md">
<div class="flex bg-panel-2-dark rounded-lg p-1 border border-outline-variant/10">
<button class="flex-1 py-1.5 rounded-md bg-surface-variant text-on-surface font-subtitle-header text-subtitle-header shadow-sm transition-all duration-200">Wi-Fi</button>
<button class="flex-1 py-1.5 rounded-md text-muted-dark hover:text-on-surface font-subtitle-header text-subtitle-header transition-all duration-200">Setup</button>
<button class="flex-1 py-1.5 rounded-md text-muted-dark hover:text-on-surface font-subtitle-header text-subtitle-header transition-all duration-200">Status</button>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-md overflow-hidden flex flex-col gap-md pb-[140px]">
<h2 class="font-section-label text-section-label text-muted-dark uppercase px-sm">Available Networks</h2>
<!-- Networks Card -->
<div class="bg-panel-dark rounded-card border border-outline-variant/20 shadow-card bg-card-sheen flex-1 overflow-hidden flex flex-col relative transition-transform hover:-translate-y-[1px] duration-300">
<div class="overflow-y-auto custom-scrollbar flex-1 p-xs">
<!-- Network Item 1 (Active/Connected) -->
<div class="flex items-center gap-md p-md rounded-xl hover:bg-surface-variant/30 cursor-pointer transition-colors group relative overflow-hidden bg-surface-variant/10">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-[60%] bg-ok rounded-r-full"></div>
<i class="w-5 h-5 text-ok stroke-[2.2px]" data-lucide="wifi"></i>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-body text-body text-on-surface truncate pr-2 font-medium">JouleSuite_HQ</span>
<i class="w-3.5 h-3.5 text-muted-dark stroke-[2.2px]" data-lucide="lock"></i>
</div>
<div class="font-mono-code text-mono-code text-muted-dark flex items-center gap-2 mt-0.5 opacity-80">
<span>CH 11</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>-45 dBm</span>
</div>
</div>
</div>
<!-- Network Item 2 -->
<div class="flex items-center gap-md p-md rounded-xl hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<i class="w-5 h-5 text-on-surface stroke-[2.2px]" data-lucide="wifi"></i>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-body text-body text-on-surface truncate pr-2">Guest_Access</span>
<i class="w-3.5 h-3.5 text-muted-dark stroke-[2.2px]" data-lucide="unlock"></i>
</div>
<div class="font-mono-code text-mono-code text-muted-dark flex items-center gap-2 mt-0.5 opacity-80">
<span>CH 6</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>-62 dBm</span>
</div>
</div>
</div>
<!-- Network Item 3 -->
<div class="flex items-center gap-md p-md rounded-xl hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<i class="w-5 h-5 text-muted-light stroke-[2.2px] opacity-70" data-lucide="wifi"></i>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-body text-body text-muted-light truncate pr-2">Dev_IoT_Net</span>
<i class="w-3.5 h-3.5 text-muted-dark stroke-[2.2px]" data-lucide="lock"></i>
</div>
<div class="font-mono-code text-mono-code text-muted-dark flex items-center gap-2 mt-0.5 opacity-80">
<span>CH 1</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>-78 dBm</span>
</div>
</div>
</div>
<!-- Network Item 4 -->
<div class="flex items-center gap-md p-md rounded-xl hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<i class="w-5 h-5 text-muted-light stroke-[2.2px] opacity-50" data-lucide="wifi"></i>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-body text-body text-muted-light truncate pr-2">Lab_Sensors</span>
<i class="w-3.5 h-3.5 text-muted-dark stroke-[2.2px]" data-lucide="lock"></i>
</div>
<div class="font-mono-code text-mono-code text-muted-dark flex items-center gap-2 mt-0.5 opacity-80">
<span>CH 36</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>-85 dBm</span>
</div>
</div>
</div>
<!-- Network Item 5 -->
<div class="flex items-center gap-md p-md rounded-xl hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<i class="w-5 h-5 text-muted-light stroke-[2.2px] opacity-30" data-lucide="wifi"></i>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-body text-body text-muted-dark truncate pr-2">Hidden Network</span>
<i class="w-3.5 h-3.5 text-muted-dark stroke-[2.2px]" data-lucide="eye-off"></i>
</div>
<div class="font-mono-code text-mono-code text-muted-dark flex items-center gap-2 mt-0.5 opacity-50">
<span>CH ?</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>-92 dBm</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Action Section -->
<div class="fixed bottom-0 left-0 w-full max-w-[390px] bg-bg-dark/90 backdrop-blur-xl border-t border-outline-variant/10 p-md pb-[max(env(safe-area-inset-bottom),16px)] z-40">
<div class="flex flex-col gap-sm">
<div class="relative">
<i class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-dark stroke-[2.2px]" data-lucide="key"></i>
<input class="w-full bg-panel-2-dark border border-outline-variant/20 rounded-lg py-2.5 pl-9 pr-3 text-on-surface font-body text-body placeholder:text-muted-dark focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all" placeholder="Enter network password" type="password"/>
</div>
<button class="w-full bg-brand-gradient text-panel-light font-button text-button py-3 rounded-full shadow-btn hover:-translate-y-[2px] transition-transform duration-200 flex items-center justify-center gap-2">
<span>Connect</span>
<i class="w-4 h-4 stroke-[2.2px]" data-lucide="arrow-right"></i>
</button>
</div>
</div>
<script>
        lucide.createIcons();
    </script>
</body></html>
