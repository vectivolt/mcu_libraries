<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
        }
        body {
            background-color: #08090f;
            color: #e4e1ed;
        }
        .blur-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
        }
        .blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: rgba(99, 102, 241, 0.12); }
        .blob-2 { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: rgba(139, 92, 246, 0.08); }
        .blob-3 { top: 40%; left: 30%; width: 30vw; height: 30vw; background: rgba(99, 102, 241, 0.05); }

        .card {
            background-color: #11131c;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 0%, transparent 100%);
            pointer-events: none;
        }
        
        .status-dot {
            position: relative;
            width: 6px; height: 6px;
            border-radius: 50%;
        }
        .status-dot::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 1px solid currentColor;
            opacity: 0.18;
        }
        @keyframes pulse-ok {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-ok {
            background-color: #10b981;
            color: #10b981;
            animation: pulse-ok 2.4s infinite;
        }
    </style>
</head>
<body class="font-body text-body antialiased min-h-screen">
